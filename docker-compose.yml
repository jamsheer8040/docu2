services:
  db:
    image: mysql:8.0
    container_name: docclear_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: docclear_db
      MYSQL_ROOT_PASSWORD: supersecretroot
      MYSQL_USER: docuser
      MYSQL_PASSWORD: docpassword
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: docclear_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "5000:5000"
    volumes:
      - backend_uploads:/app/uploads
      - backend_backups:/app/backups
    environment:
      PORT: 5000
      NODE_ENV: production
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: docclear_db
      DB_USER: root
      DB_PASS: supersecretroot
      JWT_SECRET: docclear_production_jwt_secret_key_change_me
      JWT_EXPIRES_IN: 24h
      FRONTEND_URL: http://localhost:3000

  frontend:
    build: ./frontend
    container_name: docclear_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mysql_data:
  backend_uploads:
  backend_backups:
